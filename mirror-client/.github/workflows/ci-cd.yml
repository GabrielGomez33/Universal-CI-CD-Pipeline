# =============================================================================
# MIRROR FRONTEND CI/CD PIPELINE
# =============================================================================
# Enterprise-grade pipeline for the Mirror React SPA frontend.
#
# TRIGGERS:
#   - Push to main or develop → full pipeline + deploy
#   - Pull request to main or develop → quality gates only (no deploy)
#   - Manual dispatch → full pipeline with optional deploy
#
# QUALITY GATES:
#   1. Dependency install (deterministic via npm ci)
#   2. ESLint code quality check
#   3. TypeScript strict type-check (tsc -b --noEmit)
#   4. Vite production build (generates optimized dist/)
#   5. Bundle size analysis (prevent bloat)
#   6. Security audit (npm audit)
#
# DEPLOYMENT:
#   - SSH into production server as mirror_app
#   - Git pull → npm ci → vite build → copy .htaccess
#   - Smoke test (verify /Mirror/ serves index.html)
#   - NO PM2 restart needed (static files served by Apache)
#
# NOTE: The frontend source lives at /var/www/mirror-client/ on the server.
#       Vite builds to /var/www/mirror-client/dist/ which Apache serves
#       via Alias "/Mirror" "/var/www/mirror-client/dist"
# =============================================================================

name: Mirror Frontend CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Force deploy to production'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '22'

jobs:
  # ===========================================================================
  # JOB 1: QUALITY GATES
  # ===========================================================================
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # The Mirror repo has source in client/ subdirectory
    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint check
        run: npm run lint
        continue-on-error: true

      - name: TypeScript type-check
        run: npx tsc -b --noEmit

      - name: Vite production build
        run: npm run build

      - name: Verify build output
        run: |
          if [ ! -f "dist/index.html" ]; then
            echo "::error::Build failed — dist/index.html not found"
            exit 1
          fi

          if [ ! -f "dist/.htaccess" ]; then
            echo "::error::Build missing .htaccess — SPA routing will break"
            exit 1
          fi

          echo "Build artifacts verified:"
          ls -la dist/
          echo ""
          echo "Asset sizes:"
          du -sh dist/assets/* 2>/dev/null || echo "No assets directory"
          echo ""
          TOTAL_SIZE=$(du -sh dist/ | cut -f1)
          echo "Total bundle size: $TOTAL_SIZE"

      - name: Bundle size check
        run: |
          # Warn if total bundle exceeds 5MB (Three.js + TensorFlow are large)
          TOTAL_KB=$(du -sk dist/ | cut -f1)
          echo "Bundle size: ${TOTAL_KB}KB"

          if [ "$TOTAL_KB" -gt 10240 ]; then
            echo "::warning::Bundle size is ${TOTAL_KB}KB (>10MB). Consider code splitting."
          elif [ "$TOTAL_KB" -gt 5120 ]; then
            echo "::notice::Bundle size is ${TOTAL_KB}KB (>5MB). Monitor for growth."
          else
            echo "Bundle size is within acceptable limits."
          fi

      - name: Security audit
        run: npm audit --audit-level=high
        continue-on-error: true

  # ===========================================================================
  # JOB 2: DEPLOY TO PRODUCTION
  # ===========================================================================
  deploy:
    name: Deploy to Production
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true')

    environment:
      name: production
      url: https://theundergroundrailroad.world/Mirror/

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Create pre-deploy snapshot
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'SNAPSHOT'
          cd ${{ secrets.SERVER_SOURCE_PATH }}
          CURRENT_COMMIT=$(git rev-parse HEAD)
          echo "Pre-deploy commit: $CURRENT_COMMIT"
          echo "$CURRENT_COMMIT" > /tmp/.mirror-client-rollback-commit

          # Backup current dist for instant rollback (no rebuild needed)
          if [ -d "dist" ]; then
            rm -rf /tmp/.mirror-client-dist-backup
            cp -r dist /tmp/.mirror-client-dist-backup
            echo "Dist backup created at /tmp/.mirror-client-dist-backup"
          fi
          SNAPSHOT

      - name: Deploy Mirror frontend
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'DEPLOY_SCRIPT'
          set -e

          echo "=========================================="
          echo "  MIRROR FRONTEND DEPLOYMENT"
          echo "  $(date '+%Y-%m-%d %H:%M:%S')"
          echo "=========================================="

          cd ${{ secrets.SERVER_SOURCE_PATH }}

          # Step 1: Pull latest code
          echo "[1/4] Pulling latest code..."
          git fetch origin main
          git reset --hard origin/main

          # Step 2: Install dependencies
          echo "[2/4] Installing dependencies..."
          npm ci

          # Step 3: Build with Vite
          echo "[3/4] Building frontend..."
          npm run build

          # Step 4: Verify build
          echo "[4/4] Verifying build..."
          if [ ! -f "dist/index.html" ]; then
            echo "ERROR: Build failed — dist/index.html missing!"
            exit 1
          fi

          if [ ! -f "dist/.htaccess" ]; then
            echo "ERROR: .htaccess missing from dist — SPA routing will break!"
            exit 1
          fi

          echo ""
          echo "Deploy complete."
          echo "Dist contents:"
          ls -la dist/
          echo ""
          echo "Bundle size: $(du -sh dist/ | cut -f1)"
          DEPLOY_SCRIPT

      - name: Smoke test
        id: smoke_test
        run: |
          echo "Running smoke test..."
          MAX_RETRIES=3
          RETRY_INTERVAL=3

          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $i/$MAX_RETRIES..."

            HTTP_CODE=$(ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
              ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
              "curl -sk -o /dev/null -w '%{http_code}' https://localhost/Mirror/" \
              2>/dev/null || echo "000")

            echo "Smoke test response: HTTP $HTTP_CODE"

            if [ "$HTTP_CODE" = "200" ]; then
              echo "smoke_status=healthy" >> $GITHUB_OUTPUT
              echo "Smoke test PASSED — /Mirror/ returns 200"
              exit 0
            fi

            if [ "$i" -lt "$MAX_RETRIES" ]; then
              echo "Retrying in ${RETRY_INTERVAL}s..."
              sleep $RETRY_INTERVAL
            fi
          done

          echo "smoke_status=unhealthy" >> $GITHUB_OUTPUT
          echo "::error::Smoke test FAILED — /Mirror/ not responding"
          exit 1

      - name: Rollback on failure
        if: failure() && steps.smoke_test.outputs.smoke_status == 'unhealthy'
        run: |
          echo "::error::DEPLOYING ROLLBACK..."
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'ROLLBACK_SCRIPT'
          cd ${{ secrets.SERVER_SOURCE_PATH }}

          # Fast rollback: restore dist backup (no rebuild needed)
          if [ -d "/tmp/.mirror-client-dist-backup" ]; then
            echo "Restoring dist from backup..."
            rm -rf dist
            cp -r /tmp/.mirror-client-dist-backup dist
            echo "Fast rollback complete."
          else
            echo "No dist backup found. Rolling back via git..."
            ROLLBACK_COMMIT=$(cat /tmp/.mirror-client-rollback-commit 2>/dev/null)
            if [ -n "$ROLLBACK_COMMIT" ]; then
              git checkout "$ROLLBACK_COMMIT"
              npm ci
              npm run build
            fi
          fi
          ROLLBACK_SCRIPT

      - name: Tag release
        if: success()
        run: |
          VERSION="v$(date +'%Y.%m.%d')-${GITHUB_SHA::7}"
          git tag "$VERSION"
          git push origin "$VERSION"
          echo "Tagged release: $VERSION"

      - name: Create GitHub Release
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const version = `v${new Date().toISOString().slice(0,10).replace(/-/g,'.')}-${context.sha.slice(0,7)}`;
            const commits = await github.rest.repos.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 10
            });
            const changelog = commits.data
              .slice(0, 5)
              .map(c => `- ${c.commit.message.split('\n')[0]}`)
              .join('\n');

            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: version,
              name: `Mirror Frontend ${version}`,
              body: `## Deployment\n- **Date**: ${new Date().toISOString()}\n- **Commit**: ${context.sha}\n- **Triggered by**: ${context.actor}\n\n## Recent Changes\n${changelog}`,
              draft: false,
              prerelease: false
            });

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
